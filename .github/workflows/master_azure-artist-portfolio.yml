name: Build and Deploy Node.js App to Azure Web App - azure-artist-portfolio

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build frontend
      - name: Build frontend
        run: npm run build

      # Verify frontend build exists
      - name: Verify frontend build
        run: |
          echo "Listing contents of root:"
          ls -la
          echo "Listing contents of dist folder:"
          ls -la dist
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not found. Frontend build failed."
            exit 1
          else
            echo "Frontend build verified: dist folder exists."
          fi

      # Prepare backend (included as-is)
      - name: Prepare backend
        run: |
          echo "Listing contents of backend2 folder:"
          ls -la backend2

      # Upload artifacts for deployment (frontend + backend + package files)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist
            backend2
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Download artifacts from build job
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Debug: list files before deployment
      - name: List files before deployment
        run: |
          echo "Listing all files in deploy folder:"
          ls -la

      # Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'azure-artist-portfolio'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5792066E15434969AD5314C23683003E }}
